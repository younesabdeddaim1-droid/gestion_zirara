<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cmedBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <linearGradient id="blueSwoosh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <linearGradient id="greenSwoosh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>

    <linearGradient id="orangeSwoosh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="redHead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>

    <filter id="cmedShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- App Icon Base Shape -->
  <rect width="512" height="512" rx="112" fill="url(#cmedBgGrad)" stroke="#CBD5E1" stroke-width="4"/>
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="#0A1A44" stroke-opacity="0.06" stroke-width="3"/>

  <!-- CMED Logo Central Emblem -->
  <g filter="url(#cmedShadow)" transform="translate(0, -10)">
    <!-- Red Head / Dot -->
    <ellipse cx="236" cy="136" rx="28" ry="20" fill="url(#redHead)" />

    <!-- Blue Outer Swirl Curve -->
    <path d="M 246 160 C 200 168, 165 205, 168 254 C 171 300, 206 338, 260 348 C 220 342, 188 316, 186 274 C 184 230, 212 186, 252 170 Z" fill="url(#blueSwoosh)" />

    <!-- Green Dynamic Swirl Curve -->
    <path d="M 188 305 C 225 304, 270 286, 288 236 C 298 206, 288 180, 266 166 C 286 178, 292 206, 282 232 C 265 272, 224 296, 188 305 Z" fill="url(#greenSwoosh)" />

    <!-- Orange Right Arch Swirl Curve -->
    <path d="M 264 168 C 308 178, 342 216, 342 264 C 342 316, 302 368, 238 384 C 290 364, 326 322, 326 274 C 326 230, 298 188, 264 168 Z" fill="url(#orangeSwoosh)" />
  </g>

  <!-- Bilingual Branding Inscriptions -->
  <!-- Arabic Calligraphy Inscription -->
  <text x="256" y="415" text-anchor="middle" font-family="'Cairo', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="21" fill="#0A1A44" letter-spacing="0.5">الهيئة المغربية للتربية والتنمية</text>

  <!-- French Translation -->
  <text x="256" y="442" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="12" fill="#0284C7" letter-spacing="1">CORPS MAROCAIN POUR ÉDUCATION ET DÉVELOPPEMENT</text>

  <!-- Applet Focus Banner -->
  <g transform="translate(156, 460)">
    <rect width="200" height="28" rx="14" fill="#0A1A44" />
    <text x="100" y="19" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#57E4FF" letter-spacing="2">CENTRE ZIRARA</text>
  </g>
</svg>
